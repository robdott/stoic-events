name: Sync Meetup events

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch events from Meetup
        run: python sync.py
      - name: Commit if changed
        run: |
          git config user.name "events-sync"
          git config user.email "events-sync@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || git commit -m "Update events"
          git push
